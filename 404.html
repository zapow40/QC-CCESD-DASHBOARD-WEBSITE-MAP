<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCESD</title></head><body><script>
(function(){
  var project="/QC-CCESD-DASHBOARD-WEBSITE-MAP";
  var path=location.pathname;
  var base=path.indexOf(project)===0?project:"";
  var rest=base?path.slice(base.length):path;
  if(rest==="/"||rest==="") location.replace(base+"/");
  else location.replace(base+"/?route="+encodeURIComponent(rest)+(location.search||"")+(location.hash||""));
})();
</script><p>Opening CCESD…</p></body></html>
